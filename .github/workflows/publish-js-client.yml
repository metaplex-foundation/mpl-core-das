name: Publish JS Client

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor
      tag:
        description: NPM Tag (and preid for pre-releases)
        required: true
        type: string
        default: latest
      create_release:
        description: Create a GitHub release
        required: true
        type: boolean
        default: true

env:
  CACHE: true

jobs:
  test_js:
    name: JS client
    uses: ./.github/workflows/test-js-client.yml
    secrets: inherit

  publish_js:
    name: JS client / Publish
    runs-on: ubuntu-latest
    needs: test_js
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load environment variables
        run: cat .github/.env >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install npm >= 11.5.1
        run: npm install -g "npm@>=11.5.1"

      - name: Install dependencies
        uses: metaplex-foundation/actions/install-node-dependencies@v1
        with:
          folder: ./
          cache: ${{ env.CACHE }}
          key: clients-js

      - name: Build
        working-directory: ./
        run: pnpm build

      - name: Bump
        id: bump
        working-directory: ./
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ startsWith(inputs.bump, 'pre') }}" == "true" ]; then
            pnpm version "$BUMP" --preid "$TAG" --no-git-tag-version
          else
            pnpm version "$BUMP" --no-git-tag-version
          fi
          echo "new_version=$(pnpm pkg get version | sed 's/"//g')" >> $GITHUB_OUTPUT

      - name: Publish
        working-directory: ./
        env:
          TAG: ${{ inputs.tag }}
        run: npm publish --access public --tag "$TAG"

      - name: Create release pull request
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: release JS client v${{ steps.bump.outputs.new_version }}'
          branch: release/js-client-v${{ steps.bump.outputs.new_version }}
          title: 'chore: release JS client v${{ steps.bump.outputs.new_version }}'
          body: |
            ## Summary
            - publish-js-client workflow bumped the package to `${{ steps.bump.outputs.new_version }}`
          labels: release
